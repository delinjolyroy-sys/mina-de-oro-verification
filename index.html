<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKP Mina de Oro Chapter - Membership Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.card {
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    text-align: center;
}

.header {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 5px;
}

.chapter {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
}

.verified {
    display: inline-block;
    background: #198754;
    color: white;
    padding: 9px 18px;
    border-radius: 30px;
    font-weight: bold;
    margin-bottom: 20px;
}

.photo {
    width: 170px;
    height: 170px;
    object-fit: cover;
    border-radius: 12px;
    border: 4px solid #222;
    margin-bottom: 18px;
}

.name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 15px;
}

.details {
    text-align: left;
    margin-top: 15px;
}

.details p {
    margin: 10px 0;
    padding: 10px;
    background: #f7f7f7;
    border-radius: 8px;
}

.label {
    font-weight: bold;
}

.message {
    margin-top: 22px;
    padding: 15px;
    background: #eef7ee;
    border-radius: 10px;
    line-height: 1.5;
    font-weight: bold;
}

.footer {
    margin-top: 20px;
    font-size: 13px;
    color: #666;
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        ALPHA KAPPA RHO
    </div>

    <div class="chapter">
        MINA DE ORO CHAPTER
    </div>

    <div class="verified">
        ✓ MEMBERSHIP VERIFIED
    </div>

    <div id="member">
        Loading membership information...
    </div>

    <div class="footer">
        Alpha Kappa Rho International Humanitarian Service
        Fraternity and Sorority
    </div>

</div>

<script>

const members = {

    "AKP-MDO-001": {
        name: "MEMBER NAME",
        position: "POSITION",
        id: "AKP-MDO-001",
        date: "DATE SURVIVE",
        status: "Legit Member",
        photo: ""
    }

};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const member = members[id];

const container = document.getElementById("member");

if (member) {

    container.innerHTML = `

        ${member.photo ? `<img class="photo" src="${member.photo}" alt="Member Photo">` : ""}

        <div class="name">
            ${member.name}
        </div>

        <div class="details">

            <p>
                <span class="label">Position:</span>
                ${member.position}
            </p>

            <p>
                <span class="label">Membership ID No.:</span>
                ${member.id}
            </p>

            <p>
                <span class="label">Date Survive:</span>
                ${member.date}
            </p>

            <p>
                <span class="label">Status:</span>
                ${member.status}
            </p>

        </div>

        <div class="message">
            The person whose name and picture appears here is a
            LEGIT member of Alpha Kappa Rho Mina de Oro Chapter.
        </div>

    `;

} else {

    container.innerHTML = `

        <h2>Member Not Found</h2>

        <p>
            Please scan a valid Alpha Kappa Rho
            Mina de Oro Chapter membership QR code.
        </p>

    `;

}

</script>

</body>
</html>
